name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Security issues must **not** be reported here; see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `usb-android-tethering --version` (or the commit hash)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.5, MacBook Pro (Apple Silicon)
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Samsung Galaxy S24, Android 16
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options:
        - Background service (install)
        - Foreground (sudo usb-android-tethering)
        - probe / devices / status only
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `usb-android-tethering devices --json` and `usb-android-tethering status --json`
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Run in the foreground with `sudo usb-android-tethering -vv`, or attach `/var/log/usb-android-tethering.log`.
        Remove anything you consider private (for example public IP addresses).
      render: text
  - type: input
    id: vpn
    attributes:
      label: VPN or proxy software in use (if any)
